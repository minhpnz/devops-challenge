server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Docker's embedded DNS. Without a resolver, nginx resolves api:3000 once at
    # startup and keeps using that IP forever - so when the api container is
    # recreated with a new address, every request 502s until nginx is reloaded.
    # Re-resolving needs the target in a variable; a static upstream block is
    # never re-resolved.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        default_type text/plain;
        return 200 "Welcome to the platform\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_backend "http://api:3000";
        proxy_pass $api_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }

    location = /status {
        set $api_backend "http://api:3000";
        proxy_pass $api_backend/status;

        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }
}
