name: apply Terraform root
description: Create and apply one authoritative plan, verified against the reviewed change set.

inputs:
  environment:
    description: Terraform root under terraform/env
    required: true
  role-arn:
    description: GitHub Actions Terraform apply role ARN
    required: true
  aws-region:
    description: AWS region
    required: true
  terraform-version:
    description: Terraform CLI version
    required: true
  expected-fingerprint:
    description: >-
      Change-set fingerprint produced by the preview job that the approver read.
      The apply aborts if its own plan does not match. Empty disables the check.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-tf-${{ inputs.environment }}-${{ github.run_id }}

    - name: initialize
      shell: bash
      run: terraform init -input=false -lock-timeout=5m
      working-directory: terraform/env/${{ inputs.environment }}

    # A fresh plan rather than a replayed artifact. A plan created before the
    # approval — or in an earlier run — can no longer be trusted to describe what
    # applying will do, because the world may have moved since.
    - name: create authoritative plan
      shell: bash
      run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan
      working-directory: terraform/env/${{ inputs.environment }}

    # ...which leaves the question the approver actually cares about: is this the
    # change they said yes to? The preview job published a fingerprint of its
    # change set; if this plan disagrees, something happened between review and
    # approval and a human needs to look again. Failing here is cheap. Applying
    # an unreviewed change to production is not.
    - name: verify against reviewed change set
      if: inputs.expected-fingerprint != ''
      shell: bash
      run: |
        set -euo pipefail
        terraform show -json tfplan \
          | jq -r '[.resource_changes[]
                    | select(.change.actions != ["no-op"])
                    | "\(.address) \(.change.actions | join(","))"]
                   | sort | .[]' > changeset.txt

        ACTUAL=$(sha256sum changeset.txt | cut -d' ' -f1)
        EXPECTED="${{ inputs.expected-fingerprint }}"

        if [ "${ACTUAL}" != "${EXPECTED}" ]; then
          echo "::error::plan changed since it was reviewed (expected ${EXPECTED:0:12}, got ${ACTUAL:0:12})"
          {
            echo "### Aborted — \`${{ inputs.environment }}\` plan no longer matches the review"
            echo ""
            echo "Expected \`${EXPECTED:0:12}\`, got \`${ACTUAL:0:12}\`."
            echo "Something changed between the preview and this approval:"
            echo "infrastructure drift, a concurrent apply, or a state change."
            echo ""
            echo "Re-run the workflow to produce a fresh preview and review that."
            echo ""
            echo '```'
            cat changeset.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "::notice::plan matches the reviewed change set (${ACTUAL:0:12})"
      working-directory: terraform/env/${{ inputs.environment }}

    - name: apply
      shell: bash
      run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan
      working-directory: terraform/env/${{ inputs.environment }}

    - name: outputs
      shell: bash
      run: |
        {
          echo "### Terraform outputs — ${{ inputs.environment }}"
          echo ""
          echo '```json'
          terraform output -json \
            | jq 'with_entries(if .value.sensitive then .value = "<sensitive>" else .value = .value.value end)'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: terraform/env/${{ inputs.environment }}
