name: preview Terraform root
description: Plan one environment root and publish a reviewable change set with a fingerprint.

inputs:
  environment:
    description: Terraform root under terraform/env
    required: true
  role-arn:
    description: Read-only Terraform plan role ARN
    required: true
  aws-region:
    description: AWS region
    required: true
  terraform-version:
    description: Terraform CLI version
    required: true

outputs:
  fingerprint:
    description: Hash of the planned change set, handed to the apply job to verify against.
    value: ${{ steps.fingerprint.outputs.value }}
  has-changes:
    description: "true when the plan is non-empty"
    value: ${{ steps.fingerprint.outputs.has_changes }}

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-tf-preview-${{ inputs.environment }}-${{ github.run_id }}

    - name: initialize
      shell: bash
      run: terraform init -input=false -lock-timeout=5m
      working-directory: terraform/env/${{ inputs.environment }}

    # -lock=false: this plan never writes state, and taking the lock here would
    # block a concurrent apply for no benefit.
    - name: plan
      shell: bash
      run: |
        set -o pipefail
        terraform plan -input=false -lock=false -no-color -out=tfplan \
          -detailed-exitcode 2>&1 | tee plan.txt || EXIT=$?
        if [ "${EXIT:-0}" = "1" ]; then exit 1; fi
      working-directory: terraform/env/${{ inputs.environment }}

    # The fingerprint covers which resources change and how (create / update /
    # delete / replace), not the attribute values.
    #
    # Values are deliberately excluded: a plan is full of "known after apply"
    # placeholders that differ between two runs of an identical change, so
    # hashing them would fail every apply and the check would be switched off
    # within a week. What this catches is the failure that matters — a resource
    # appearing in, or vanishing from, the change set between review and apply.
    - name: fingerprint change set
      id: fingerprint
      shell: bash
      run: |
        set -euo pipefail
        terraform show -json tfplan \
          | jq -r '[.resource_changes[]
                    | select(.change.actions != ["no-op"])
                    | "\(.address) \(.change.actions | join(","))"]
                   | sort | .[]' > changeset.txt

        VALUE=$(sha256sum changeset.txt | cut -d' ' -f1)
        COUNT=$(wc -l < changeset.txt | tr -d ' ')
        echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
        echo "has_changes=$([ "${COUNT}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

        {
          echo "### Plan preview — \`${{ inputs.environment }}\`"
          echo ""
          echo "\`${COUNT}\` resource change(s), fingerprint \`${VALUE:0:12}\`"
          echo ""
          if [ "${COUNT}" -gt 0 ]; then
            echo '```'
            cat changeset.txt
            echo '```'
          fi
          echo "<details><summary>full plan</summary>"
          echo ""
          echo '```hcl'
          tail -c 50000 plan.txt
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: terraform/env/${{ inputs.environment }}
